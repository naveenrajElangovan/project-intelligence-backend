[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "project-intelligence-backend"
version = "0.1.0"
description = "REST backend for Project Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aioodbc>=0.5,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "azure-identity>=1.24,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.26,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.17,<5",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.15,<3",
  "mypy>=1.20,<2",
  "pre-commit>=4.6,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 73.35
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F811"]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
warn_unused_configs = true
