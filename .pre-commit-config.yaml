repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: make format-check
        language: system
        pass_filenames: false
      - id: mypy
        name: repository mypy
        entry: make type-check
        language: system
        pass_filenames: false
      - id: import-boundaries
        name: Import architecture contracts
        entry: make imports
        language: system
        pass_filenames: false
      - id: dependency-usage
        name: Python dependency usage
        entry: make dependencies
        language: system
        pass_filenames: false
      - id: tests-and-coverage
        name: Tests and coverage gate
        entry: make test
        language: system
        pass_filenames: false
